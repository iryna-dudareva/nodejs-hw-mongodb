tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: "Get list of contacts"
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    description: Sort contacts by page they are at
    schema:
      type: integer
    example: 1
  - in: query
    name: perPage
    description: Sort contacts by amount of them per page
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    description: Sort contacts by name
    schema:
      type: string
      example: name
  - in: query
    name: sortOrder
    description: Sort contacts in certain specified order
    schema:
      type: string
      enum: ["asc", "desc"]
      example: "asc"
  - in: query
    name: type
    description: Filter contacts by type
    schema:
      type: string
      enum: ["personal", "work", "home"]
      example: home
  - in: query
    name: isFavourite
    description: Filter contacts by favourite status
    schema:
      type: boolean
      example: true
responses:
  "200":
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: "../../components/schemas/contact.yaml"
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 4
                totalItems:
                  type: number
                  example: 4
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  "401":
    $ref: "../../components/responses/401.yaml"
