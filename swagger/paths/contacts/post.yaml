tags:
  - Contacts
summary: Create contact
operationId: addContact
description: "Create a contact"
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: "John Doe"
          email:
            description: "Contact's email"
            type: string
            example: john@example.com
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: +1234567890
          contactType:
            description: "Type of contact, can be chosen from 3 options"
            type: string
            enum: ["work", "personal", "home"]
            example: personal
          isFavourite:
            description: "Whether is contact is in favourites"
            type: boolean
            example: false
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  "201":
    description: Creates a contact with given data
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: "../../components/schemas/contact.yaml"
  "400":
    description: Bad request, missing required data
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Empty required field(s)!
  "401":
    $ref: "../../components/responses/401.yaml"
