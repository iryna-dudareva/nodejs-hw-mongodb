type: object
required:
  - _id
  - name
  - email
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name. Should be between 3 and 20 symbols."
    type: string
    example: "John Doe"
  email:
    description: "Contact's email"
    type: string
    example: john@example.com
  contactType:
    description: "Contact's type"
    type: string
    enum: ["work", "personal", "home"]
  phoneNumber:
    description: "Contact's phone number. Should be between 3 and 20 symbols."
    type: string
    example: +1234567890
  isFavourite:
    description: " Whether the contact is in favourites"
    type: boolean
    example: true
  userId:
    description: "User id to access a contact"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
